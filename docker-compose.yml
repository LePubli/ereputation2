version: '3.8'

services:
  # Application principale
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://prospector:prospector_pass@db:5432/prospector
      - LOG_LEVEL=INFO
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - prospector-network
    command: >
      sh -c "mkdir -p /app/logs /app/data &&
             chmod 777 /app/logs /app/data &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis pour l'Event Bus
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector_pass
      POSTGRES_DB: prospector
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  postgres-data:
  app-logs:
  app-data:

networks:
  prospector-network:
    driver: bridge
