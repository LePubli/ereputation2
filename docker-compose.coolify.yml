version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector_password}
      POSTGRES_DB: ${POSTGRES_DB:-prospector}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospector} -d ${POSTGRES_DB:-prospector}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Coolify gère le port via son proxy, on expose seulement en interne ou on retire le mapping host
    # Si vous devez absolument mapper, utilisez un port dynamique ou laissez Coolify faire
    # ports: 
    #   - "8000:8000" 
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prospector}:${POSTGRES_PASSWORD:-prospector_password}@db:5432/${POSTGRES_DB:-prospector}
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - INSEE_API_KEY=${INSEE_API_KEY:-}
      - PAPPERS_API_KEY=${PAPPERS_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prospector-network
    command: >
      sh -c "mkdir -p /app/logs /app/data && 
             chmod 777 /app/logs /app/data &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Définition stricte des volumes nommés
volumes:
  pgdata:
  redis-data:
  app-logs:
  app-data:

networks:
  prospector-network:
    driver: bridge
