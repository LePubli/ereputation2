version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector_password_secure
      POSTGRES_DB: prospector
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour l'Event Bus
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Application Principale
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://prospector:prospector_password_secure@db:5432/prospector
    volumes:
      # Utilisation de volumes nommés pour éviter les problèmes de permissions Linux
      - app-logs:/app/logs
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prospector-network
    command: >
      sh -c "mkdir -p /app/logs /app/data && 
             chmod 777 /app/logs /app/data &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Définition des volumes nommés (gérés par Docker, pas par l'hôte directement)
volumes:
  pgdata:
  redis-data:
  app-logs:
  app-data:

networks:
  prospector-network:
    driver: bridge
