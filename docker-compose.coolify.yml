# Docker Compose optimisé pour Coolify
# Ce fichier est conçu pour être importé directement dans Coolify
# Il gère : PostgreSQL, Redis, l'API FastAPI et les migrations

version: '3.8'

services:
  # -----------------------------------------------------------
  # DATABASE: PostgreSQL (Persistant)
  # -----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: b2b-prospector-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-prospector_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospector}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # CACHE & QUEUE: Redis (Persistant)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: b2b-prospector-redis
    restart: always
    command: redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_strong_redis}
    volumes:
      - redisdata:/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # CORE API: FastAPI Application
  # -----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-prospector-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-prospector}:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/${POSTGRES_DB:-prospector_db}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_strong_redis}@redis:6379/0
      # App Config
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:-change_me_super_secret_key_min_32_chars}
      # API Keys (Optionnel - à remplir dans Coolify UI)
      INSEE_API_KEY: ${INSEE_API_KEY:-}
      PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-} # Optionnel si utilisé
      # Features
      ENABLE_PLUGINS: scraper-insee,audit-digital,pain-point-engine,pipeline-kanban,semantic-analyzer,predictive-scorer,outreach-multichannel,voice-assistant,ab-testing,automation-engine,compliance-guard
    volumes:
      - ./logs:/app/logs
      - ./data/uploads:/app/data/uploads
    networks:
      - prospector-network
    # Coolify gère le port exposure via son interface, on ne mappe pas de port ici
    # pour éviter les conflits. Coolify assignera un port interne.

  # -----------------------------------------------------------
  # WORKER: Background Tasks (Optionnel - Commenté par défaut)
  # -----------------------------------------------------------
  # Le worker est optionnel pour Coolify. Décommentez si vous avez implémenté le module app.workers.run_worker
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: b2b-prospector-worker
  #   restart: always
  #   command: python -m app.workers.run_worker --concurrency 4
  #   depends_on:
  #     - db
  #     - redis
  #     - api
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-prospector}:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/${POSTGRES_DB:-prospector_db}
  #     REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_strong_redis}@redis:6379/0
  #     ENVIRONMENT: production
  #     SECRET_KEY: ${SECRET_KEY:-change_me_super_secret_key_min_32_chars}
  #     ENABLE_PLUGINS: ${ENABLE_PLUGINS:-all}
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./data/uploads:/app/data/uploads
  #   networks:
  #     - prospector-network

networks:
  prospector-network:
    driver: bridge
    # Coolify utilise souvent un réseau externe, mais ici on crée un réseau isolé
    # Si Coolify injecte son propre réseau, il se connectera automatiquement

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
