version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector_secret}
      POSTGRES_DB: prospector
    volumes:
      - pg/var/lib/postgresql/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-/data
    networks:
      - prospector-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # SUPPRIMEZ LA LIGNE CI-DESSOUS (ports) pour laisser Coolify gérer le réseau
    # ports:
    #   - "8000:8000" 
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://prospector:${POSTGRES_PASSWORD:-prospector_secret}@db:5432/prospector
    volumes:
      - app-logs:/app/logs
      - app-/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prospector-network
    # Le container écoute toujours en interne sur le 8000, mais n'expose pas le port à l'hôte directement
    command: >
      sh -c "mkdir -p /app/logs /app/data && 
             chmod 777 /app/logs /app/data &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pg
  redis-
  app-logs:
  app-

networks:
  prospector-network:
    driver: bridge
