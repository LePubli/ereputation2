# ============================================================================
# B2B Prospector — Stack Coolify (Docker Compose)
# Compatible : Coolify 4.x, Docker 29.x, Ubuntu 24 LTS
# ============================================================================
# Notes Coolify :
#  - Coolify gère lui-même les domaines, le HTTPS (Traefik/Caddy), et les
#    variables d'environnement via son UI. Les variables référencées avec
#    ${VAR} ici doivent être définies dans Coolify > Environment Variables.
#  - Les ports exposés vers l'host (ports:) sont volontairement minimaux ;
#    Coolify route via son proxy interne sur le service "frontend".
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # FRONTEND — React/Vite servi par Nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /!\ Les ARG injectés ici sont visibles dans le bundle JS public.
        # N'y mettez JAMAIS de secret. Pour les vrais secrets → service "app".
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-B2B Prospector}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    image: ereputation2-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - prospector
    expose:
      - "8080"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    # ------------------------------------------------------------------
    # FIX read-only + non-root nginx :
    #  - read_only: true     → tout le filesystem est read-only, sécurité max
    #  - tmpfs: /tmp         → seul chemin writable (le nginx.conf redirige
    #                          tous les *_temp_path et le pid vers /tmp/nginx)
    #
    # NE PAS ajouter de tmpfs sur /var/cache/nginx ni /var/run :
    #    cela écraserait les répertoires créés au build avec leurs permissions
    #    correctes, et nginx (uid 101 non-root) ne pourrait plus y écrire.
    # ------------------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m

  # --------------------------------------------------------------------------
  # APP — Backend FastAPI / Uvicorn
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ereputation2-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # --- Application ---
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      APP_NAME: ${APP_NAME:-B2B Prospector}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api/v1}

      # --- Sécurité (OBLIGATOIRES — à définir dans Coolify) ---
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in Coolify}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # --- CORS ---
      CORS_ORIGINS: ${CORS_ORIGINS:-https://prospect.le-publicitaire.fr}

      # --- Database ---
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prospector}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-prospector}

      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # --- External APIs (optionnels) ---
      INSEE_API_KEY: ${INSEE_API_KEY:-}
      INSEE_API_SECRET: ${INSEE_API_SECRET:-}
      PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # --- LLM ---
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      LLM_API_URL: ${LLM_API_URL:-http://ollama:11434}

      # --- SMTP ---
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}

      # --- RGPD & rate limit ---
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-365}
      ALLOW_B2B_ONLY: ${ALLOW_B2B_ONLY:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}

      # --- Monitoring ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospector
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # DB — PostgreSQL 16
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-prospector}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - prospector
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospector} -d ${POSTGRES_DB:-prospector} -q"]
      interval: 30s    # ← passé de 10s à 30s : suffisant pour la santé, divise les logs par 3
      timeout: 5s
      retries: 5
      start_period: 20s
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_min_duration_statement=1000"   # log slow queries > 1s
      # ----- FIX bruit logs : pg_isready loggait connection/auth/disconnect
      # toutes les 10s. On désactive pour la prod ; à réactiver en debug.
      - "-c"
      - "log_connections=off"
      - "-c"
      - "log_disconnections=off"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # REDIS — Cache & Event Bus (avec auth)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    networks:
      - prospector
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 30s    # ← idem db : moins de bruit
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # OLLAMA — LLM local (optionnel, désactivable via profile)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["llm"]
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - prospector
    expose:
      - "11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "5m"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
volumes:
  postgres-data:
  redis-data:
  app-logs:
  app-data:
  ollama-data:

networks:
  prospector:
    driver: bridge
