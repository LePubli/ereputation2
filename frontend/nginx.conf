###############################################################################
# Nginx config — B2B Prospector Frontend
# - SPA fallback (React Router)
# - Reverse-proxy /api/ vers le backend FastAPI
# - Headers de sécurité production (CSP, HSTS, etc.)
# - Compatible non-root + read-only filesystem :
#     tous les chemins runtime (cache_temp, pid, fastcgi_temp...) sont
#     redirigés vers /tmp/nginx qui est monté en tmpfs writable.
###############################################################################

# user nginx;  # commenté : sans effet quand le master tourne en non-root

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ---- MIME & defaults --------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ---- Chemins temporaires writable (FIX read-only fs) ------------------
    client_body_temp_path  /tmp/nginx/client_temp;
    proxy_temp_path        /tmp/nginx/proxy_temp;
    fastcgi_temp_path      /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path        /tmp/nginx/uwsgi_temp;
    scgi_temp_path         /tmp/nginx/scgi_temp;

    # ---- Logs JSON structurés --------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /dev/stdout json_combined;

    # ---- Performance ------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;

    # ---- Limites & timeouts ----------------------------------------------
    client_max_body_size 50M;
    client_body_timeout  30s;
    client_header_timeout 10s;

    # ---- Compression Gzip -------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml application/wasm image/svg+xml;

    include /etc/nginx/conf.d/*.conf;

    # =====================================================================
    # SERVER BLOCK : SPA + reverse-proxy API
    # =====================================================================
    server {
        listen       8080 default_server;
        # listen       [::]:8080 default_server;   # décommenter si IPv6 dispo
        server_name  _;

        root         /usr/share/nginx/html;
        index        index.html;

        # ---- Headers de sécurité (toutes routes) -------------------------
        add_header X-Frame-Options              "SAMEORIGIN"           always;
        add_header X-Content-Type-Options       "nosniff"              always;
        add_header X-XSS-Protection             "1; mode=block"        always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
        # CSP : 'unsafe-inline' nécessaire pour Vite + Tailwind (styles inlinés au build)
        add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

        # ---- Healthcheck dédié -------------------------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---- Reverse-proxy vers le backend FastAPI -----------------------
        location /api/ {
            proxy_pass         http://app:8000;
            proxy_http_version 1.1;

            # WebSocket / SSE support (streaming LLM)
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Request-ID      $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering       off;
            proxy_cache_bypass    $http_upgrade;
        }

        # ---- Assets statiques avec hash Vite : cache 1 an immutable -----
        # NOTE : access_log RESTE ACTIVÉ ici pour faciliter le diagnostic.
        # En production stable, vous pouvez le passer à `off` pour réduire
        # le volume de logs (les assets hashés ne changent pas, peu d'intérêt à logguer).
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif|wasm|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---- index.html : pas de cache (déploiements transparents) ------
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # ---- SPA fallback : toute route inconnue → index.html -----------
        # Ce fallback NE TOUCHE PAS aux assets (intercepted par le bloc ci-dessus
        # qui renvoie un 404 propre si le fichier .js/.css est absent).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- Bloque dotfiles (sauf .well-known) -------------------------
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---- Pages d'erreur ---------------------------------------------
        # Ne PAS rediriger les 404 vers /index.html : sinon une requête JS manquante
        # renverrait du HTML, et le navigateur planterait avec une SyntaxError.
        # Le SPA fallback est déjà géré par `try_files ... /index.html` au-dessus.
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
