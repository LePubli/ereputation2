###############################################################################
# Nginx config — B2B Prospector Frontend
# - SPA fallback (React Router)
# - Reverse-proxy /api/ vers le backend FastAPI
# - Headers de sécurité production (CSP, HSTS, etc.)
# - Compression Gzip + Brotli (si dispo)
# - Cache long pour assets immutables (Vite hash dans le nom de fichier)
# - PID file dans /var/run/nginx/ pour utilisateur non-root
###############################################################################

# Pid file dans un repertoire accessible par l'utilisateur nginx
pid /var/run/nginx/nginx.pid;

# Logs au format JSON pour ingestion Loki/Grafana/Datadog
log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # Logs structurés
    access_log   /var/log/nginx/access.log json_combined;
    error_log    /var/log/nginx/error.log warn;

    # Limites & sécurité réseau
    client_max_body_size 50M;             # Aligné sur MAX_UPLOAD_SIZE_MB backend
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;                    # Cache la version Nginx

    # ----- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml application/wasm image/svg+xml;

    # ----- Headers de sécurité (appliqués à toutes les routes) ---------------
    add_header X-Frame-Options              "SAMEORIGIN"           always;
    add_header X-Content-Type-Options       "nosniff"              always;
    add_header X-XSS-Protection             "1; mode=block"        always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    # HSTS : à activer une fois HTTPS confirmé par Coolify (Let's Encrypt)
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
    # CSP raisonnable pour SPA Vite + Tailwind. Adapter si CDN externes.
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # ----- Healthcheck dédié (utilisé par Docker HEALTHCHECK + Coolify) ------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----- Reverse-proxy vers le backend FastAPI ----------------------------
    location /api/ {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;

        # WebSocket support (utile pour SSE/streaming LLM, voice-assistant)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Forwarding standard
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        # Timeouts adaptés à du LLM (Ollama peut prendre du temps)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;            # Streaming SSE friendly

        # Cache bypass
        proxy_cache_bypass    $http_upgrade;
    }

    # ----- Assets statiques avec hash Vite : cache 1 an immutable -----------
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif|wasm|map)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- index.html : pas de cache (déploiements transparents) ------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ----- SPA fallback : toute route inconnue → index.html -----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Bloque les fichiers cachés et sensibles --------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----- Pages d'erreur ---------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
